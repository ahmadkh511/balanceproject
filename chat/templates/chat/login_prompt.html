<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قناة اتصال خاصة</title>
<style nonce="{{ csp_nonce }}">
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #f0f7ff 0%, #f7f7f7 100%);
    padding: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    padding: 45px 35px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    text-align: center;
    max-width: 460px;
    width: 100%;
  }
  .icon { font-size: 60px; margin-bottom: 15px; }
  h1 { color: #333; margin: 0 0 12px; font-size: 22px; }
  p { color: #666; line-height: 1.8; margin: 0 0 25px; font-size: 15px; }
  a.login-btn {
    display: inline-block;
    padding: 12px 32px;
    background: #007bff;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.2s;
  }
  a.login-btn:hover { background: #0069d9; }
  .info {
    font-size: 12px;
    color: #999;
    margin-top: 25px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>قناة اتصال خاصة</h1>
  <p>
    هذه قناة تواصل خاصة بينك وبين الإدارة.
    <br>
    لتتمكن من الوصول، يُرجى تسجيل الدخول بحسابك.
  </p>
  <a href="{{ login_url }}?next={{ request.path }}" class="login-btn">
    تسجيل الدخول
  </a>
  <div class="info">
    هذه القناة مخصصة للحسابات المصرّح لها فقط.
    <br>
    إذا لم تكن تملك حساباً مفعّلاً، يُرجى التواصل مع الإدارة.
  </div>
</div>
</body>
</html>
