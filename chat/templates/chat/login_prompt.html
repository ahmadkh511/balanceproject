<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قناة اتصال خاصة</title>
<style nonce="{{ csp_nonce }}">
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    height: 100%;
  }

  body {
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f0f7ff 0%, #f7f7f7 100%);
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  .card {
    background: #fff;
    padding: 45px 35px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    text-align: center;
    max-width: 460px;
    width: 100%;
    margin: auto;
  }

  .icon {
    font-size: 60px;
    margin-bottom: 15px;
    line-height: 1;
  }

  h1 {
    color: #333;
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
  }

  p {
    color: #666;
    line-height: 1.8;
    margin: 0 0 25px;
    font-size: 15px;
  }

  a.login-btn {
    display: inline-block;
    padding: 14px 32px;
    background: #007bff;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.2s;
    width: 100%;
  }

  a.login-btn:hover { background: #0069d9; }

  .info {
    font-size: 12px;
    color: #999;
    margin-top: 25px;
    line-height: 1.6;
  }

  /* ============ استجابة الموبايل ============ */
  @media (max-width: 480px) {
    body {
      padding: 12px;
    }

    .card {
      padding: 30px 20px;
      border-radius: 12px;
      max-width: 100%;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    a.login-btn {
      padding: 14px 20px;
      font-size: 16px;
    }

    .info {
      font-size: 12px;
      margin-top: 20px;
    }
  }

  /* ============ شاشات صغيرة جداً ============ */
  @media (max-width: 360px) {
    body { padding: 8px; }
    .card { padding: 25px 16px; }
    .icon { font-size: 44px; }
    h1 { font-size: 18px; }
    p { font-size: 13px; }
    a.login-btn { padding: 12px 16px; font-size: 15px; }
    .info { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>قناة اتصال خاصة</h1>
  <p>
    هذه قناة تواصل خاصة بينك وبين الإدارة.
    <br>
    لتتمكن من الوصول، يُرجى تسجيل الدخول بحسابك.
  </p>
  <a href="{{ login_url }}?next={{ request.path }}" class="login-btn">
    تسجيل الدخول
  </a>
  <div class="info">
    هذه القناة مخصصة للحسابات المصرّح لها فقط.
    <br>
    إذا لم تكن تملك حساباً مفعّلاً، يُرجى التواصل مع الإدارة.
  </div>
</div>
</body>
</html>
