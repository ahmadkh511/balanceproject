<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لا توجد محادثة</title>
<style nonce="{{ csp_nonce }}">
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: #f7f7f7;
    padding: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    padding: 45px 35px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    text-align: center;
    max-width: 500px;
    width: 100%;
  }
  .icon { font-size: 60px; margin-bottom: 15px; }
  h1 { color: #333; margin: 0 0 12px; font-size: 22px; }
  p { color: #666; line-height: 1.8; margin: 0 0 20px; font-size: 15px; }
  .hint {
    background: #f0f7ff;
    border: 1px solid #cce4ff;
    border-radius: 8px;
    padding: 15px;
    color: #0d47a1;
    font-size: 14px;
    line-height: 1.7;
  }
  a.home-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    background: #007bff;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
  }
  a.home-btn:hover { background: #0069d9; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">💬</div>
  <h1>لا توجد لديك محادثة حالياً</h1>
  <p>
    هذه القناة مخصصة للتواصل الخاص مع الإدارة.
    <br>
    لا توجد لديك محادثة مفتوحة في الوقت الحالي.
  </p>
  <div class="hint">
    إذا كنت بحاجة إلى التواصل بخصوص أمر تجاري خاص،
    <br>
    يُرجى مراسلة الإدارة للحصول على تفعيل القناة.
  </div>
  <a href="/" class="home-btn">العودة إلى الرئيسية</a>
</div>
</body>
</html>
