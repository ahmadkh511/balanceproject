<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير مصرح بالوصول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #ffc107; /* لون أصفر هادئ بدل الأحمر المخيف */
            line-height: 1;
        }
        .btn-home {
            background-color: #0d6efd;
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-home:hover {
            background-color: #0b5ed7;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">🔒</div>
        <div class="error-code">403</div>
        <h2 class="mt-3 text-secondary">عذراً، هذه الصفحة مقفلة!</h2>
        <p class="text-muted mt-3">
            يبدو أنك لا تملك الصلاحية اللازمة للوصول إلى هذا القسم.<br>
            لا تقلق، هذا ليس خطأ منك، فقط تواصل مع مدير النظام إذا كنت تعتقد أن هناك مشكلة.
        </p>
        <a href="{% url 'index' %}" class="btn-home">العودة للوحة التحكم 🏠</a>
    </div>

</body>
</html>
