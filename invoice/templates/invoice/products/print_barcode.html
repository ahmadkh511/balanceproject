{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @page {
            size: 50mm 30mm; /* مقاس الملصق */
            margin: 0;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            margin: 0;
            padding: 1mm 2mm;
            box-sizing: border-box;
            background: #fff;
            height: 30mm; /* تثبيت الارتفاع لمنع ظهور صفحة فارغة إضافية */
            overflow: hidden;
        }
        .product-name {
            font-size: 10px;
            font-weight: 700;
            color: #000;
            margin: 0 0 1px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .specs-text {
            font-size: 8px;
            color: #333;
            margin: 0 0 2px 0;
            font-weight: 600;
        }
        .price {
            font-size: 12px;
            font-weight: 800;
            color: #006064;
            margin: 1px 0 0 0;
        }
        #barcodeSvg {
            display: block;
            margin: 0 auto;
        }
        
        .print-btn-wrapper {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
        }
        .print-btn {
            background: #0097a7;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        @media print {
            .no-print { display: none !important; }
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
        }
    </style>
</head>
<body>

    <!-- زر الطباعة -->
    <div class="print-btn-wrapper no-print">
        <button class="print-btn" id="printBarcodeBtn">
            <i class="fas fa-print"></i> طباعة
        </button>
    </div>

    <!-- 1. اسم المنتج -->
    <div class="product-name">{{ product.product_name }}</div>

    <!-- 2. المواصفات المختصرة -->
    {% if product.barcode_specs_text %}
    <div class="specs-text">{{ product.barcode_specs_text }}</div>
    {% endif %}

    <!-- 3. مكان رسم الباركود -->
    <svg id="barcodeSvg" data-barcode-value="{{ product.main_barcode|default:product.uniqueId }}"></svg>

    <!-- 4. السعر -->
    <div class="price">{{ product.sale_price }} $</div>

    <!-- ========================================================== -->
    <!-- كود خداع الميدل وير (حماية BalanceIq)                       -->
    <!-- ========================================================== -->
    <!-- نضع الكلاس الذي يبحث عنه الميدل وير داخل عنصر مخفي تماماً -->
    <div style="display: none; visibility: hidden; height: 0; overflow: hidden;">
        <div class="text-md-start mb-1 mb-md-0">
            <span></span>
        </div>
    </div>
    <!-- ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function() {
            var barcodeSvg = document.getElementById('barcodeSvg');
            var barcodeValue = barcodeSvg.getAttribute('data-barcode-value');

            if (barcodeValue && barcodeValue.trim() !== '') {
                JsBarcode(barcodeSvg, barcodeValue, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 9,
                    margin: 1,
                    height: 35,
                    width: 1.4
                });
            }

            var printBtn = document.getElementById('printBarcodeBtn');
            if (printBtn) {
                printBtn.addEventListener('click', function() {
                    window.print();
                });
            }
        });
    </script>
</body>
</html>
