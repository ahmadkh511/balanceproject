{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة باركود - {{ product.product_name }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        @page {
            size: 50mm 30mm; /* مقاس الملصق */
            margin: 0;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            margin: 0;
            padding: 1mm 2mm; /* تقليل الحواف للحد الأقصى */
            box-sizing: border-box;
            background: #fff;
        }
        .product-name {
            font-size: 10px;
            font-weight: 700;
            color: #000;
            margin: 0 0 1px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .specs-text {
            font-size: 8px;
            color: #333;
            margin: 0 0 2px 0;
            font-weight: 600;
        }
        .price {
            font-size: 12px;
            font-weight: 800;
            color: #006064;
            margin: 1px 0 0 0;
        }
        #barcodeSvg {
            display: block;
            margin: 0 auto;
        }
        /* إخفاء أي عناصر غير مرغوبة عند الطباعة */
        @media print {
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
        }
    </style>
</head>
<body>

    <!-- 1. اسم المنتج -->
    <div class="product-name">{{ product.product_name }}</div>

    <!-- 2. المواصفات المختصرة (أحمر - XL) -->
    {% if product.barcode_specs_text %}
    <div class="specs-text">{{ product.barcode_specs_text }}</div>
    {% endif %}

    <!-- 3. مكان رسم الباركود (تم وضع القيمة في data-barcode-value لفصلها عن JS) -->
    <svg id="barcodeSvg" data-barcode-value="{{ product.main_barcode|default:product.uniqueId }}"></svg>

    <!-- 4. السعر -->
    <div class="price">{{ product.sale_price }} $</div>

    <!-- استدعاء مكتبة JsBarcode لرسم الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    
    <!-- ========================================================== -->
    <!-- JavaScript — مع nonce، لا يوجد Django بداخله            -->
    <!-- ========================================================== -->
    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function() {
            var barcodeSvg = document.getElementById('barcodeSvg');
            var barcodeValue = barcodeSvg.getAttribute('data-barcode-value');

            // التأكد من وجود قيمة قبل محاولة رسم الباركود
            if (barcodeValue && barcodeValue.trim() !== '') {
                JsBarcode(barcodeSvg, barcodeValue, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 9,
                    margin: 1,
                    height: 35,      /* ارتفاع الخطوط */
                    width: 1.4       /* سماكة الخطوط */
                });
            }

            // فتح نافذة الطباعة تلقائياً
            window.onload = function() {
                setTimeout(function() {
                    window.print();
                }, 300); // تأخير بسيط لضمان رسم الباركود قبل الطباعة
            };
        });
    </script>
</body>
</html>
